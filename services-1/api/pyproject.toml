[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "bcrypt<5",
    "libpass[bcrypt]>=1.9.3",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "tinydb>=4.9.0",
    "uvicorn[standard]>=0.52.4",
    "resend>=2.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false
